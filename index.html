<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sri Hari Designer</title>
<link href="https://fonts.googleapis.com/css2?family=Mukta+Malar:wght@400;500;700&family=Yeseva+One&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf8fc;--surface:#fff;--tint:#f4ecf7;--ink:#2b1636;--muted:#665372;--line:#e3d7ea;--rani:#b3135f;--peacock:#0d6663;--zari:#a97b1e;--shadow:0 1px 2px rgba(43,22,54,.06),0 10px 28px rgba(43,22,54,.08);--f-display:'Yeseva One',serif;--f-body:'Mukta Malar',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);line-height:1.6}
.wrap{max-width:1120px;margin:auto;padding:0 16px}header{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 0}.brand{font-family:var(--f-display);font-size:22px}
.zari{height:12px;background:var(--zari)} .btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:999px;cursor:pointer}
.btn.pri{background:var(--rani);color:#fff;border-color:var(--rani)} .btn.sm{padding:6px 12px;font-size:14px}
.hero{padding:32px 0;display:grid;grid-template-columns:1.2fr .8fr;gap:20px}@media(max-width:800px){.hero{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.input{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px} .hide{display:none!important}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:#fff;border-radius:18px;padding:20px;max-width:400px;width:100%}
.thumb{width:100%;height:210px;object-fit:cover;border-radius:12px}
</style>
</head>
<body>
<div class="zari"></div>
<header><div class="wrap top"><div class="brand">🪷 Sri Hari Designer</div><div style="margin-left:auto;display:flex;gap:8px"><span id="adminStatus" style="font-size:13px;color:var(--muted)"></span><button id="adminBtn" class="btn sm">Admin Login</button></div></div></header>

<div class="wrap hero"><div><h1 style="font-family:var(--f-display);font-size:42px;line-height:1.05">Weaves from Komarapalayam</h1><p style="color:var(--muted);margin-top:10px">Only 2 admins can upload. Visitors only view & contact.</p><div style="margin-top:16px"><a href="#gallery" class="btn pri">View Collection</a></div></div><div class="card"><h3>Contact</h3><p>📍 Komarapalayam<br>WhatsApp for orders</p></div></div>

<div class="wrap" id="galleryWrap"><input id="search" class="input" placeholder="Search designs..." style="max-width:320px;margin-bottom:12px"><div id="gallery" class="grid"></div></div>

<div id="adminPanel" class="wrap hide" style="margin-top:24px"><div class="card" style="border:2px dashed var(--rani)"><h2 style="font-family:var(--f-display)">Admin Upload</h2><div style="display:grid;gap:10px;margin-top:12px"><input id="upTitle" class="input" placeholder="Title"><select id="upCat" class="input"><option>Silk</option><option>Cotton</option><option>Powerloom</option><option>Handloom</option><option>Blouse</option></select><input id="upPrice" class="input" placeholder="Price"><input id="upFile" type="file" accept="image/*" class="input"><button id="upBtn" class="btn pri">Upload</button><div id="upStatus" style="font-size:13px;color:var(--muted)"></div></div></div></div>

<div id="loginModal" class="modal hide"><div class="modal-box"><h3>Admin Login</h3><p style="font-size:13px;color:var(--muted)">Password checked on server, not visible in code.</p><div style="display:grid;gap:10px;margin-top:12px"><input id="loginUser" class="input" placeholder="Username"><input id="loginPass" type="password" class="input" placeholder="Password"><button id="loginSubmit" class="btn pri">Login</button><button id="loginCancel" class="btn">Cancel</button><div id="loginErr" style="color:#b3135f;font-size:13px"></div></div></div></div>

<script>
const $=s=>document.querySelector(s);
let DESIGNS=[], IS_ADMIN=false, TOKEN=localStorage.getItem('sh_token')||'';
async function loadDesigns(){ try{ DESIGNS=await fetch('/api/designs').then(r=>r.json()); }catch{ DESIGNS=[]; } render(); }
function render(){ const q=($('#search').value||'').toLowerCase(); const list=DESIGNS.filter(d=>!q||d.title.toLowerCase().includes(q)); $('#gallery').innerHTML=list.map(d=>`<div class=card><img class=thumb src="${'${d.image}'}"><h4>${'${d.title}'}</h4><div style="font-size:13px;color:var(--muted)">${'${d.category}'} - ₹${'${d.price||""}'}</div>${'${IS_ADMIN?`<button class="btn sm" style="margin-top:8px" onclick="deleteDesign('${'${d.id}'}')">Delete</button>`:''}'}</div>`).join('')||'<p>No designs yet</p>'; }
$('#search').addEventListener('input',render);
async function checkAuth(){ if(!TOKEN) return; const r=await fetch('/api/admin/me',{headers:{Authorization:'Bearer '+TOKEN}}).then(r=>r.json()).catch(()=>({})); if(r.ok){ IS_ADMIN=true; $('#adminPanel').classList.remove('hide'); $('#adminStatus').textContent='Admin: '+r.user; $('#adminBtn').textContent='Logout'; } else logout(); render(); }
function logout(){ IS_ADMIN=false; TOKEN=''; localStorage.removeItem('sh_token'); $('#adminPanel').classList.add('hide'); $('#adminStatus').textContent=''; $('#adminBtn').textContent='Admin Login'; render(); }
$('#adminBtn').onclick=()=>{ if(IS_ADMIN) logout(); else $('#loginModal').classList.remove('hide'); };
$('#loginCancel').onclick=()=>$('#loginModal').classList.add('hide');
$('#loginSubmit').onclick=async()=>{ const user=$('#loginUser').value.trim(), pass=$('#loginPass').value; $('#loginErr').textContent='Checking...'; const res=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({user,pass})}).then(r=>r.json()); if(res.ok){ TOKEN=res.token; localStorage.setItem('sh_token',TOKEN); $('#loginModal').classList.add('hide'); checkAuth(); } else $('#loginErr').textContent=res.error||'Failed'; };
$('#upBtn').onclick=async()=>{ const title=$('#upTitle').value, cat=$('#upCat').value, price=$('#upPrice').value, file=$('#upFile').files[0]; if(!title||!file){ $('#upStatus').textContent='Title + image needed'; return; } $('#upStatus').textContent='Uploading...'; const fd=new FormData(); fd.append('file',file); const up=await fetch('/api/upload',{method:'POST',headers:{Authorization:'Bearer '+TOKEN},body:fd}).then(r=>r.json()); if(!up.url){ $('#upStatus').textContent='Upload failed'; return; } const des={id:Date.now().toString(),title,category:cat,price,image:up.url}; DESIGNS.unshift(des); await fetch('/api/designs',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(DESIGNS)}); $('#upStatus').textContent='Done!'; render(); };
window.deleteDesign=async(id)=>{ if(!confirm('Delete?')) return; DESIGNS=DESIGNS.filter(d=>d.id!==id); await fetch('/api/designs',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+TOKEN},body:JSON.stringify(DESIGNS)}); render(); };
loadDesigns().then(checkAuth);
</script>
</body>
</html>
